<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de G-Mini Agent Server</title>
  <desc id="desc">Los clientes (CLI gmini, app de escritorio, extensión y dispositivos) llegan por Tailscale o por un proxy con TLS a la API remota v1 del núcleo, que corre como servicio de usuario de systemd o en Docker y guarda sus datos en GMINI_HOME.</desc>
  <style>
    :root { --bg: #ffffff; --panel: #f6f7f9; --stroke: #d0d5dd; --text: #1d2939; --muted: #667085; --accent: #1570ef; --accent-soft: #eff4ff; --ok: #067647; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --panel: #161b22; --stroke: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --accent-soft: #10213a; --ok: #3fb950; }
    }
    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--stroke); stroke-width: 1; }
    .box { fill: var(--bg); stroke: var(--stroke); stroke-width: 1; }
    .core { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
    .title { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text); }
    .label { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text); }
    .small { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
    .mono { font: 12px ui-monospace, "Cascadia Mono", Consolas, monospace; fill: var(--text); }
    .line { stroke: var(--muted); stroke-width: 1.4; fill: none; }
    .accent-line { stroke: var(--accent); stroke-width: 1.6; fill: none; }
    .arrow { fill: var(--muted); }
    .accent-arrow { fill: var(--accent); }
    .dot { fill: var(--ok); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="arrow"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="accent-arrow"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="540" rx="12"/>

  <!-- Clientes -->
  <rect class="panel" x="24" y="24" width="250" height="492" rx="10"/>
  <text class="title" x="44" y="54">Clientes</text>

  <rect class="box" x="44" y="72" width="210" height="76" rx="8"/>
  <text class="label" x="60" y="98">CLI gmini</text>
  <text class="small" x="60" y="118">Windows, Linux y macOS</text>
  <text class="small" x="60" y="136">pair, chat, ask, task, say</text>

  <rect class="box" x="44" y="164" width="210" height="76" rx="8"/>
  <text class="label" x="60" y="190">App de escritorio</text>
  <text class="small" x="60" y="210">Delega tareas a un</text>
  <text class="small" x="60" y="228">servidor emparejado</text>

  <rect class="box" x="44" y="256" width="210" height="64" rx="8"/>
  <text class="label" x="60" y="282">Extensión del navegador</text>
  <text class="small" x="60" y="302">Chat y acciones web</text>

  <rect class="box" x="44" y="336" width="210" height="76" rx="8"/>
  <text class="label" x="60" y="362">Dispositivos</text>
  <text class="small" x="60" y="382">ESP32, Raspberry Pi</text>
  <text class="small" x="60" y="400">voz, cara, LEDs, relés</text>

  <rect class="box" x="44" y="428" width="210" height="68" rx="8"/>
  <text class="label" x="60" y="454">Emparejamiento</text>
  <text class="small" x="60" y="474">Código de 6 dígitos o QR</text>

  <!-- Red -->
  <rect class="panel" x="318" y="150" width="190" height="240" rx="10"/>
  <text class="title" x="338" y="180">Red</text>
  <rect class="box" x="336" y="196" width="154" height="78" rx="8"/>
  <text class="label" x="352" y="222">Tailscale</text>
  <text class="small" x="352" y="242">IP 100.x privada,</text>
  <text class="small" x="352" y="260">recomendado</text>
  <rect class="box" x="336" y="290" width="154" height="78" rx="8"/>
  <text class="label" x="352" y="316">Proxy con TLS</text>
  <text class="small" x="352" y="336">Caddy u otro,</text>
  <text class="small" x="352" y="354">dominio propio</text>

  <!-- Flechas de clientes a la red -->
  <path class="line" d="M254 110 C 290 110, 300 235, 334 235" marker-end="url(#a)"/>
  <path class="line" d="M254 202 C 285 202, 300 240, 334 240" marker-end="url(#a)"/>
  <path class="line" d="M254 288 C 285 288, 300 325, 334 325" marker-end="url(#a)"/>
  <path class="line" d="M254 374 C 290 374, 300 332, 334 332" marker-end="url(#a)"/>

  <!-- Núcleo -->
  <rect class="panel" x="552" y="24" width="384" height="492" rx="10"/>
  <text class="title" x="572" y="54">Servidor 24/7</text>

  <rect class="core" x="572" y="72" width="344" height="238" rx="10"/>
  <circle class="dot" cx="592" cy="96" r="5"/>
  <text class="label" x="604" y="101">Núcleo de G-Mini (modo headless)</text>
  <text class="mono" x="592" y="126">python -m backend.main --headless</text>

  <rect class="box" x="592" y="142" width="304" height="68" rx="8"/>
  <text class="label" x="608" y="166">API remota v1</text>
  <text class="mono" x="608" y="186">/api/v1/* REST + SSE</text>
  <text class="mono" x="608" y="202">/api/v1/ws WebSocket</text>

  <rect class="box" x="592" y="222" width="146" height="72" rx="8"/>
  <text class="label" x="606" y="246">Agente</text>
  <text class="small" x="606" y="266">modelos, skills,</text>
  <text class="small" x="606" y="282">conectores, MCP</text>

  <rect class="box" x="750" y="222" width="146" height="72" rx="8"/>
  <text class="label" x="764" y="246">Tareas y voz</text>
  <text class="small" x="764" y="266">cron, intervalos,</text>
  <text class="small" x="764" y="282">TTS, STT, avisos</text>

  <!-- Flechas de la red al núcleo -->
  <path class="accent-line" d="M490 235 C 530 235, 545 176, 588 176" marker-end="url(#b)"/>
  <path class="accent-line" d="M490 329 C 535 329, 545 190, 588 190" marker-end="url(#b)"/>

  <!-- Despliegue -->
  <rect class="box" x="572" y="326" width="166" height="96" rx="8"/>
  <text class="label" x="588" y="352">systemd --user</text>
  <text class="small" x="588" y="372">install-server.sh del</text>
  <text class="small" x="588" y="390">repositorio del núcleo</text>
  <text class="small" x="588" y="408">sin sudo</text>

  <rect class="box" x="750" y="326" width="166" height="96" rx="8"/>
  <text class="label" x="766" y="352">Docker</text>
  <text class="small" x="766" y="372">imagen en GHCR,</text>
  <text class="small" x="766" y="390">usuario sin root,</text>
  <text class="small" x="766" y="408">healthcheck</text>

  <rect class="box" x="572" y="438" width="344" height="58" rx="8"/>
  <text class="label" x="588" y="462">GMINI_HOME</text>
  <text class="small" x="588" y="482">config, conversaciones, tareas, dispositivos, registros</text>
  <path class="line" d="M655 422 L655 436" marker-end="url(#a)"/>
  <path class="line" d="M833 422 L833 436" marker-end="url(#a)"/>
</svg>
