[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gmini-cli"
dynamic = ["version"]
description = "CLI de G-Mini Agent y herramientas para ejecutar el núcleo como servidor 24/7"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "G-Mini Agent" }]
keywords = ["g-mini", "agent", "cli", "assistant", "server", "selfhosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Natural Language :: Spanish",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=13",
    "rich>=13.7",
    "keyring>=24",
    "platformdirs>=3.5",
    "segno>=1.6",
]

[project.optional-dependencies]
repl = ["prompt_toolkit>=3.0.43"]
dev = [
    "pytest>=8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
gmini = "gmini_cli.cli:main"

[project.urls]
Homepage = "https://github.com/angelgabrieljacintohuayllasco/G-Mini-Agent-Server"
Issues = "https://github.com/angelgabrieljacintohuayllasco/G-Mini-Agent-Server/issues"
Changelog = "https://github.com/angelgabrieljacintohuayllasco/G-Mini-Agent-Server/blob/main/CHANGELOG.md"
"Núcleo" = "https://github.com/angelgabrieljacintohuayllasco/G-Mini-Agent"

[tool.hatch.version]
path = "src/gmini_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gmini_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "src/gmini_cli",
    "tests",
    "docs",
    "docker",
    "README.md",
    "README.en.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "LICENSE",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RUF", "PT", "RET"]
ignore = [
    # Los textos de la interfaz están en español y usan signos como ¿ ¡ « ».
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["gmini_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: pruebas lentas que crean entornos virtuales o procesos reales",
]
